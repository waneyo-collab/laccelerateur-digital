<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Confirmation — L'Accélérateur Digital</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0F0A1E;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:24px;
  }
  .card{
    max-width:440px;width:100%;background:#1a1035;border-radius:16px;padding:36px 32px;
    text-align:center;
  }
  .logo{font-size:20px;font-weight:800;color:#7C3AED;margin-bottom:24px}
  .logo span{color:#A78BFA}
  h1{color:#fff;font-size:19px;margin:0 0 12px}
  p{color:rgba(255,255,255,0.7);font-size:14px;line-height:1.6;margin:0 0 28px}
  .btn{
    display:inline-block;background:#7C3AED;color:#fff;text-decoration:none;border:none;
    padding:14px 32px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;
    width:100%;
  }
  .btn:disabled{opacity:0.6;cursor:default}
  .btn:hover:not(:disabled){background:#6D28D9}
  .error{color:#FCA5A5;font-size:13px;margin-top:16px}
  .help{color:rgba(255,255,255,0.45);font-size:12px;margin-top:20px}
  .help a{color:#A78BFA;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Waneyo<span>Formation</span></div>
    <h1 id="title">Plus qu'une étape</h1>
    <p id="subtitle">Pour des raisons de sécurité, confirmez en cliquant sur le bouton ci-dessous (ce clic ne peut pas être fait automatiquement par un robot de scan d'emails).</p>
    <button class="btn" id="confirm-btn">👉 Continuer</button>
    <div id="error" class="error" style="display:none"></div>
    <div class="help">Besoin d'aide ? <a href="mailto:contact@waneyo-formation.com">contact@waneyo-formation.com</a></div>
  </div>

<script>
  // Récupère tout ce qui suit "confirmation_url=" dans la query string, sans
  // passer par URLSearchParams (qui découperait à tort sur les "&" internes
  // du lien Supabase). decodeURIComponent est sans effet si la valeur n'est
  // pas encodée (cas du merge tag Supabase {{ .ConfirmationURL }} brut).
  function getConfirmationUrl() {
    var qs = window.location.search.replace(/^\?/, '');
    var idx = qs.indexOf('confirmation_url=');
    if (idx === -1) return null;
    var raw = qs.slice(idx + 'confirmation_url='.length);
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }

  function getInnerType(url) {
    try { return new URL(url).searchParams.get('type'); } catch (e) { return null; }
  }

  var target = getConfirmationUrl();
  var btn = document.getElementById('confirm-btn');
  var errorEl = document.getElementById('error');

  if (!target) {
    btn.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = '❌ Lien invalide ou incomplet. Demandez un nouveau lien ou contactez-nous.';
  } else {
    var type = getInnerType(target);
    if (type === 'invite') {
      document.getElementById('title').textContent = 'Créez votre mot de passe';
    } else if (type === 'recovery') {
      document.getElementById('title').textContent = 'Réinitialisez votre mot de passe';
    }
    btn.addEventListener('click', function () {
      btn.disabled = true;
      btn.textContent = 'Redirection...';
      window.location.href = target;
    });
  }
</script>
</body>
</html>
